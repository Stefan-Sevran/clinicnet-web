<script>
/* =========================================================
SIAM SERENITY CHAT FUNCTION
========================================================== */

(function () {
const CHAT_API_URL =
"https://eden-audit-chat.onrender.com/revenue-receptionist-chat";

const root =
document.getElementById(
"siam-serenity-reception-chat-2026"
);

if (!root) return;

const messages =
document.getElementById(
"siam-serenity-chat-messages-2026"
);

const input =
document.getElementById(
"siam-serenity-chat-input-2026"
);

const sendButton =
document.getElementById(
"siam-serenity-chat-send-2026"
);

let sessionId =
localStorage.getItem(
"siamSerenityReceptionSession2026"
);

if (!sessionId) {
sessionId =
"siam_serenity_" +
Math.random().toString(36).substring(2) +
Date.now();

localStorage.setItem(
"siamSerenityReceptionSession2026",
sessionId
);
}

function addMessage(text, sender, loading) {
const message =
document.createElement("div");

message.className =
"siam-serenity-chat-msg-2026 " +
(
sender === "user"
? "siam-serenity-chat-user-2026"
: "siam-serenity-chat-bot-2026"
);

if (loading) {
message.classList.add(
"siam-serenity-chat-loading-2026"
);
}

message.textContent = text;

messages.appendChild(message);

messages.scrollTop =
messages.scrollHeight;

return message;
}

async function sendMessage(customText) {
const text =
String(customText || input.value || "").trim();

if (!text) return;

addMessage(text, "user");

input.value = "";
sendButton.disabled = true;

const loadingMessage =
addMessage(
"Namfon is typing...",
"bot",
true
);

try {
const response =
await fetch(CHAT_API_URL, {
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
message: text,
sessionId: sessionId,
clinic: "Siam Serenity Thailand",
clinicType:
"Thai massage and wellness spa",
assistantName: "Namfon"
})
});

if (!response.ok) {
throw new Error(
"Chat request failed"
);
}

const data =
await response.json();

loadingMessage.remove();

const reply =
data.reply ||
data.message ||
data.answer ||
data.text ||
"Thank you 😊 Would you like to book a massage or ask about our treatments?";

addMessage(reply, "bot");

} catch (error) {
loadingMessage.remove();

addMessage(
"Small connection issue. Please try again in a moment.",
"bot"
);
}

sendButton.disabled = false;
input.focus();
}

function scrollToChat() {
root.scrollIntoView({
behavior: "smooth",
block: "center"
});
}

window.siamSerenitySendMessage2026 =
sendMessage;

window.siamSerenityScrollToChat2026 =
scrollToChat;

sendButton.addEventListener(
"click",
function (event) {
event.preventDefault();
sendMessage();
}
);

input.addEventListener(
"keydown",
function (event) {
if (
event.key === "Enter" &&
!event.shiftKey
) {
event.preventDefault();
sendMessage();
}
}
);
})();
</script>

<script>
/* =========================================================
SIAM SERENITY FLOATING CHAT AUTO-SCROLL
========================================================== */

(function () {
const CHAT_LINK_ID =
"siam-serenity-floating-chat-link-2026";

const CHAT_SECTION_ID =
"siam-serenity-reception-chat-2026";

function scrollToSiamSerenityChat(event) {
if (event) {
event.preventDefault();
event.stopPropagation();
}

const chatSection =
document.getElementById(CHAT_SECTION_ID);

if (!chatSection) {
console.warn(
"Siam Serenity chat section not found: #" +
CHAT_SECTION_ID
);

return;
}

const chatTop =
chatSection.getBoundingClientRect().top +
window.pageYOffset;

const viewportHeight =
window.innerHeight ||
document.documentElement.clientHeight;

const chatHeight =
chatSection.offsetHeight;

/*
Centers the chat when possible, while preventing
scrolling above the top of the page.
*/
const targetPosition =
Math.max(
chatTop -
Math.max(
20,
(viewportHeight - chatHeight) / 2
),
0
);

window.scrollTo({
top: targetPosition,
behavior: "smooth"
});
}

function initializeSiamSerenityFloatingBar() {
const chatLink =
document.getElementById(CHAT_LINK_ID);

if (!chatLink) return;

/*
Prevents duplicate listeners if Carrd re-renders
or the script is accidentally initialized twice.
*/
if (
chatLink.dataset.siamScrollReady === "true"
) {
return;
}

chatLink.dataset.siamScrollReady = "true";

chatLink.addEventListener(
"click",
scrollToSiamSerenityChat
);
}

window.siamSerenityScrollToChat2026 =
scrollToSiamSerenityChat;

if (document.readyState === "loading") {
document.addEventListener(
"DOMContentLoaded",
initializeSiamSerenityFloatingBar,
{ once: true }
);
} else {
initializeSiamSerenityFloatingBar();
}
})();
</script>

<script>
/* =========================================================
SIAM SERENITY SERVICE BUTTON FUNCTIONS
========================================================== */

(function () {
const section =
document.getElementById(
"siam-serenity-services-section-2026"
);

const chat =
document.getElementById(
"siam-serenity-reception-chat-2026"
);

if (!section || !chat) return;

function scrollToSiamChat() {
chat.scrollIntoView({
behavior: "smooth",
block: "center"
});
}

function sendServiceMessage(message) {
scrollToSiamChat();

window.setTimeout(
function () {
if (
typeof window
.siamSerenitySendMessage2026 ===
"function"
) {
window
.siamSerenitySendMessage2026(
message
);

return;
}

const input =
document.getElementById(
"siam-serenity-chat-input-2026"
);

const sendButton =
document.getElementById(
"siam-serenity-chat-send-2026"
);

if (!input) return;

input.value = message;

input.dispatchEvent(
new Event(
"input",
{ bubbles: true }
)
);

if (sendButton) {
sendButton.click();
}
},
500
);
}

section
.querySelectorAll(
".siam-serenity-service-button-2026"
)
.forEach(
function (button) {
button.addEventListener(
"click",
function (event) {
event.preventDefault();
event.stopPropagation();

const message =
button.getAttribute(
"data-message"
);

if (!message) return;

sendServiceMessage(message);
}
);
}
);

section
.querySelectorAll(
".siam-serenity-full-image-button-2026"
)
.forEach(
function (button) {
button.addEventListener(
"click",
function (event) {
event.preventDefault();
scrollToSiamChat();
}
);
}
);
})();
</script>
