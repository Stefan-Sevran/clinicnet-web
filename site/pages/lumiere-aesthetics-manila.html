<script>
(function lumiereAestheticsChat2026() {

const LUMIERE_AE_CHAT_API_URL_2026 =
"https://eden-audit-chat.onrender.com/revenue-receptionist-chat";

const LUMIERE_AE_STORAGE_KEY_2026 =
"lumiereAestheticsManilaReceptionSession2026";

let lumiereAeSessionId2026 =
localStorage.getItem(LUMIERE_AE_STORAGE_KEY_2026);

if (!lumiereAeSessionId2026) {

lumiereAeSessionId2026 =
"lumiere_ae_" +
Math.random().toString(36).substring(2) +
Date.now();

localStorage.setItem(
LUMIERE_AE_STORAGE_KEY_2026,
lumiereAeSessionId2026
);
}

const lumiereAeRoot2026 =
document.getElementById("lumiere-ae-chat-2026");

if (!lumiereAeRoot2026) {
return;
}

const lumiereAeMessages2026 =
document.getElementById("lumiere-ae-messages-2026");

const lumiereAeInput2026 =
document.getElementById("lumiere-ae-input-2026");

const lumiereAeSendButton2026 =
document.getElementById("lumiere-ae-send-2026");

if (
!lumiereAeMessages2026 ||
!lumiereAeInput2026 ||
!lumiereAeSendButton2026
) {
return;
}

function lumiereAeAddMessage2026(
text,
sender,
isLoading
) {

const messageElement =
document.createElement("div");

messageElement.className =
"lumiere-ae-chat-message " +
(
sender === "user"
? "lumiere-ae-chat-user"
: "lumiere-ae-chat-bot"
);

if (isLoading) {
messageElement.classList.add(
"lumiere-ae-chat-loading"
);
}

messageElement.textContent = text;

lumiereAeMessages2026.appendChild(
messageElement
);

lumiereAeMessages2026.scrollTop =
lumiereAeMessages2026.scrollHeight;

return messageElement;
}

async function lumiereAeSendMessage2026(
customText
) {

const messageText =
(
customText ||
lumiereAeInput2026.value ||
""
).trim();

if (!messageText) {
return;
}

lumiereAeAddMessage2026(
messageText,
"user",
false
);

lumiereAeInput2026.value = "";
lumiereAeSendButton2026.disabled = true;

const loadingMessage =
lumiereAeAddMessage2026(
"Lumi is typing...",
"bot",
true
);

try {

const response = await fetch(
LUMIERE_AE_CHAT_API_URL_2026,
{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify({
message: messageText,
sessionId: lumiereAeSessionId2026
})
}
);

if (!response.ok) {
throw new Error(
"Chat request failed: " +
response.status
);
}

const data = await response.json();

loadingMessage.remove();

lumiereAeAddMessage2026(
data.reply ||
"Thank you 😊 How may Lumière Aesthetics help you?",
"bot",
false
);

} catch (error) {

loadingMessage.remove();

lumiereAeAddMessage2026(
"Small connection issue. Please try again in a moment.",
"bot",
false
);

} finally {

lumiereAeSendButton2026.disabled = false;
lumiereAeInput2026.focus();

}
}

lumiereAeSendButton2026.addEventListener(
"click",
function (event) {

event.preventDefault();
event.stopPropagation();

lumiereAeSendMessage2026();

}
);

lumiereAeInput2026.addEventListener(
"keydown",
function (event) {

if (
event.key === "Enter" &&
!event.shiftKey
) {

event.preventDefault();
lumiereAeSendMessage2026();

}
}
);

})();
</script>
