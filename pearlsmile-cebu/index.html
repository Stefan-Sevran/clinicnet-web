<script>
(function () {
const CHAT_API_URL =
"https://eden-audit-chat.onrender.com/booking-chat";

const root =
document.getElementById(
"pearlsmile-reception-chat-2026"
);

if (!root) return;

const messages =
root.querySelector(
"#pearlsmile-chat-messages-2026"
);

const input =
root.querySelector(
"#pearlsmile-chat-input-2026"
);

const sendBtn =
root.querySelector(
"#pearlsmile-chat-send-2026"
);

const voiceBtn =
root.querySelector(
"#pearlsmile-voice-button-2026"
);

let sessionId =
localStorage.getItem(
"pearlSmileBookingSessionIdV2"
);

if (!sessionId) {
sessionId =
"booking_pearlsmile_" +
Math.random()
.toString(36)
.substring(2) +
Date.now();

localStorage.setItem(
"pearlSmileBookingSessionIdV2",
sessionId
);
}

function addMessage(
text,
sender,
loading
) {
const div =
document.createElement("div");

div.className =
"pearlsmile-chat-message-2026 " +
(
sender === "user"
? "pearlsmile-chat-user-2026"
: "pearlsmile-chat-bot-2026"
);

if (loading) {
div.classList.add(
"pearlsmile-chat-loading-2026"
);
}

div.textContent = text;

messages.appendChild(div);

messages.scrollTop =
messages.scrollHeight;

return div;
}

function resizeInput() {
input.style.height = "auto";

input.style.height =
Math.min(
input.scrollHeight,
130
) + "px";
}

async function sendMessage(customText) {
const text =
(
customText ||
input.value ||
""
).trim();

if (!text || sendBtn.disabled) return;

addMessage(
text,
"user",
false
);

input.value = "";
resizeInput();

sendBtn.disabled = true;

const loadingMessage =
addMessage(
"Maria is typing...",
"bot",
true
);

try {
const response =
await fetch(
CHAT_API_URL,
{
method: "POST",

headers: {
"Content-Type":
"application/json"
},

body: JSON.stringify({
message: text,
sessionId: sessionId,
clinicId: "pearlsmile"
})
}
);

if (!response.ok) {
throw new Error(
"Request failed"
);
}

const data =
await response.json();

loadingMessage.remove();

addMessage(
data.reply ||
"Got it. How may I help you?",
"bot",
false
);

} catch (error) {
loadingMessage.remove();

addMessage(
"Small connection issue. Please try again in a moment.",
"bot",
false
);
}

sendBtn.disabled = false;
input.focus();
}

sendBtn.addEventListener(
"click",
function (event) {
event.preventDefault();
event.stopPropagation();
sendMessage();
}
);

input.addEventListener(
"keydown",
function (event) {
if (
event.key === "Enter" &&
!event.shiftKey
) {
event.preventDefault();
sendMessage();
}
}
);

input.addEventListener(
"input",
resizeInput
);



/* =========================================================
PEARLSMILE VOICE — same realtime voice path used by the
existing Eden clinic receptionist demo, with PearlSmile
booking attribution when a booking function is called.
========================================================= */
let pearlVoicePeerConnection = null;
let pearlVoiceAudioElement = null;
let pearlVoiceActive = false;

async function startPearlVoiceCall() {
if (!voiceBtn || pearlVoiceActive) return;

try {
voiceBtn.disabled = true;
voiceBtn.textContent = "Connecting...";

const pc = new RTCPeerConnection();
pearlVoicePeerConnection = pc;

const dataChannel = pc.createDataChannel("oai-events");

dataChannel.addEventListener("message", async function (event) {
try {
const realtimeEvent = JSON.parse(event.data);

if (
realtimeEvent.type === "response.function_call_arguments.done" &&
(
realtimeEvent.name === "create_patient_booking" ||
realtimeEvent.name === "update_patient_booking"
)
) {
const bookingArgs = JSON.parse(realtimeEvent.arguments || "{}");
const bookingAction = realtimeEvent.name === "create_patient_booking" ? "create" : "update";

try {
const bookingResponse = await fetch(
"https://eden-audit-chat.onrender.com/voice-booking",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
sessionId:sessionId,
clinicId:"pearlsmile",
bookingAction:bookingAction,
...bookingArgs
})
}
);

const bookingResult = await bookingResponse.json();

dataChannel.send(JSON.stringify({
type:"conversation.item.create",
item:{
type:"function_call_output",
call_id:realtimeEvent.call_id,
output:JSON.stringify(bookingResult)
}
}));

dataChannel.send(JSON.stringify({
type:"response.create",
response:{
instructions:bookingResult.success
? "Tell the patient briefly that their appointment request has been sent to the PearlSmile clinic team for confirmation. Do not say the appointment is confirmed."
: "Tell the patient briefly that the booking request could not be saved and ask them to continue by chat or try again."
}
}));
} catch (bookingError) {
console.error("PearlSmile voice booking error:", bookingError);
}
}
} catch (parseError) {
console.error("PearlSmile realtime event error:", parseError);
}
});

const audio = document.createElement("audio");
audio.autoplay = true;
audio.style.display = "none";
document.body.appendChild(audio);
pearlVoiceAudioElement = audio;
pc.ontrack = function (event) { audio.srcObject = event.streams[0]; };

const localStream = await navigator.mediaDevices.getUserMedia({audio:true});
localStream.getTracks().forEach(function (track) { pc.addTrack(track, localStream); });

const offer = await pc.createOffer();
await pc.setLocalDescription(offer);

const response = await fetch(
"https://eden-audit-chat.onrender.com/realtime-call",
{
method:"POST",
headers:{"Content-Type":"application/sdp"},
body:offer.sdp
}
);

if (!response.ok) throw new Error("Voice connection request failed");

const answerSdp = await response.text();
await pc.setRemoteDescription({type:"answer", sdp:answerSdp});

pearlVoiceActive = true;
voiceBtn.disabled = false;
voiceBtn.textContent = "🔴 End Voice";
} catch (error) {
console.error("PearlSmile voice call error:", error);
voiceBtn.disabled = false;
voiceBtn.textContent = "🎙️ Talk to Maria";
addMessage("Voice is unavailable right now. Please continue by chat.", "bot", false);
}
}

function stopPearlVoiceCall() {
if (pearlVoicePeerConnection) {
pearlVoicePeerConnection.getSenders().forEach(function (sender) {
if (sender.track) sender.track.stop();
});
pearlVoicePeerConnection.close();
pearlVoicePeerConnection = null;
}
if (pearlVoiceAudioElement) {
pearlVoiceAudioElement.remove();
pearlVoiceAudioElement = null;
}
pearlVoiceActive = false;
if (voiceBtn) {
voiceBtn.disabled = false;
voiceBtn.textContent = "🎙️ Talk to Maria";
}
}

if (voiceBtn) {
voiceBtn.addEventListener("click", function () {
if (pearlVoiceActive) stopPearlVoiceCall();
else startPearlVoiceCall();
});
}

})();
</script>

<script>
(function () {

const bottomSection =
document.getElementById('pearlsmile-bottom-2026');

if (!bottomSection) return;

/*
Likely IDs/classes used by the PearlSmile chat.
The script uses the first match it finds.
*/
const chatSelectors = [
'#pearlsmile-chat-2026',
'#pearlsmile-reception-chat-2026',
'#pearlsmile-chat',
'#eden-reception-chat',
'#eden-chat',
'.pearlsmile-chat-2026',
'.eden-card'
];

let mariaChat = null;

for (let i = 0; i < chatSelectors.length; i++) {
const candidate =
document.querySelector(chatSelectors[i]);

if (
candidate &&
!bottomSection.contains(candidate)
) {
mariaChat = candidate;
break;
}
}

/*
Push the image section down only by the amount
Maria's chatbox actually overlaps it.
*/
function clearMariaChatOverlap() {

bottomSection.style.paddingTop = '18px';

if (!mariaChat) return;

const chatRect =
mariaChat.getBoundingClientRect();

const bottomRect =
bottomSection.getBoundingClientRect();

const overlap =
chatRect.bottom - bottomRect.top;

if (overlap > 0) {
bottomSection.style.paddingTop =
Math.ceil(overlap + 22) + 'px';
}
}

/*
Carrd and images can shift after initial rendering,
so calculate several times.
*/
clearMariaChatOverlap();

window.addEventListener(
'load',
clearMariaChatOverlap
);

window.addEventListener(
'resize',
clearMariaChatOverlap
);

window.setTimeout(
clearMariaChatOverlap,
250
);

window.setTimeout(
clearMariaChatOverlap,
800
);

window.setTimeout(
clearMariaChatOverlap,
1600
);

if (
mariaChat &&
'ResizeObserver' in window
) {
const observer =
new ResizeObserver(
clearMariaChatOverlap
);

observer.observe(mariaChat);
}

})();
</script>
